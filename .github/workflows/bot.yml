name: Giftica auto-message

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: giftica-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check new orders and send messages
        env:
          PROM_TOKEN: ${{ secrets.PROM_TOKEN }}
        run: python bot.py
      - name: Save state
        run: |
          git config user.name "giftica-bot"
          git config user.email "bot@users.noreply.github.com"
          git add done_ids.json review_state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
